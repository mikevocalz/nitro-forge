[package]
name = "nf-fuzz"
description = "cargo-fuzz targets for every Nitro-Forge importer that parses an untrusted file. See docs/security/fuzzing.md."
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the root workspace excludes `fuzz/`, so stable builds of
# the engines never need nightly or libFuzzer, and this crate keeps its own
# Cargo.lock.
[workspace]
members = ["."]

[lib]
name = "nf_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
ignition-core = { path = "../rust/ignition-core" }
nf-color = { path = "../rust/nf-color" }
cadence-engine = { path = "../packages/cadence/rust" }
design-engine = { path = "../packages/design/rust" }
draft-engine = { path = "../packages/draft/rust" }
folio-engine = { path = "../packages/folio/rust" }
motion-engine = { path = "../packages/motion/rust" }
photo-engine = { path = "../packages/photo/rust" }
pitch-engine = { path = "../packages/pitch/rust" }
prism-engine = { path = "../packages/prism/rust" }
quill-engine = { path = "../packages/quill/rust" }
scene-engine = { path = "../packages/scene/rust" }
splice-engine = { path = "../packages/splice/rust" }
tally-engine = { path = "../packages/tally/rust" }

# Debug assertions and overflow checks stay on under `cargo fuzz` (it builds
# with --release and -Cdebug-assertions by default); keep symbols for traces.
[profile.release]
debug = 1

[[bin]]
name = "xlsx_import"
path = "fuzz_targets/xlsx_import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "docx_import"
path = "fuzz_targets/docx_import.rs"
test = false
doc = false
