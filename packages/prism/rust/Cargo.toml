[package]
name = "prism-engine"
description = "Nitro-Forge Prism engine core."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignition-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# PNG encoder for the `encodePng` read op (already in the workspace lock via
# folio-render's `image` dep; MIT OR Apache-2.0 — see THIRD_PARTY_NOTICES.md).
png = "0.18"

[dev-dependencies]
# zlib inflate for the encodePng round-trip test (already in the lock tree).
flate2 = "1"
