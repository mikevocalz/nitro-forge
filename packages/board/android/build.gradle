buildscript {
  repositories { google(); mavenCentral() }
  dependencies { classpath "com.android.tools.build:gradle:9.3.1" }
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/NitroForgeBoard+autolinking.gradle"
apply from: "./viro-canvas-capability.gradle"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

// Match NitroModules' ABI selection. Its Prefab package publishes headers for
// every consumer, but only has a shared library for architectures it built.
// Without this, an arm64-only host also builds Board for armeabi-v7a and gets
// a headers-only Nitro target, followed by unresolved margelo::nitro symbols.
def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// No Viro assets are bundled. Consumer's Viro AAR supplies CanvasSurfaces;
// this is a compile-only dependency, and runtime checks gate missing APIs.
def viroAndroidDir = null
try {
  viroAndroidDir = new File(
    providers.exec {
      workingDir(rootProject.projectDir)
      commandLine("node", "--print",
        "require('path').dirname(require.resolve('@reactvision/react-viro/package.json')) + '/android'")
    }.standardOutput.asText.get().trim()
  )
} catch (Exception e) {
  logger.warn("[forge-board] Viro package unresolved; current Android XR renderer requires it: ${e.message}")
}

// Viro's CanvasSurfaces class is optional. A Skia-only app must not compile
// the Viro-specific source files against a missing AAR. Preserve the generated
// Nitro v1 API by using a fail-closed no-Viro render-loop implementation.
def viroAar = viroAndroidDir == null ? null : new File(viroAndroidDir, "react_viro/react_viro-release.aar")
def hasViroCanvasAar = forgeBoardHasViroCanvas(viroAar)

android {
  sourceSets {
    main {
      java {
        // Select exactly one renderer implementation at configuration time.
        // Kotlin excludes on src/main/java are not reliable under AGP 9;
        // place the two Viro-bound files in an opt-in source root instead.
        srcDir(hasViroCanvasAar ? "src/viro/java" : "src/noViro/java")
      }
    }
  }
  namespace "com.margelo.nitro.forgeboard"
  ndkVersion getExtOrDefault("ndkVersion", "27.2.12479018")
  compileSdkVersion getExtOrDefault("compileSdkVersion", 37)

  defaultConfig {
    minSdkVersion Math.max(getExtOrDefault("minSdkVersion", 26).toInteger(), 26)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 36)
    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild { cmake { path "CMakeLists.txt" } }
  buildFeatures { buildConfig true; prefab true }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  packagingOptions {
    excludes += [
      "**/libc++_shared.so", "**/libNitroModules.so", "**/libfbjni.so",
      "**/libjsi.so", "**/libreactnative.so"
    ]
  }
}

repositories { google(); mavenCentral() }
dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20250517"

  if (hasViroCanvasAar) {
    compileOnly files(zipTree(viroAar).matching { include "classes.jar" })
  } else {
    logger.lifecycle("[forge-board] Viro CanvasSurfaces class absent: compiling no-Viro XR availability stub; Skia v3 2D is unaffected")
  }
}
