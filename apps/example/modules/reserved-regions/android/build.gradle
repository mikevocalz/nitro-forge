plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'ai.nitroforge'
version = '0.1.0'

/*
 * Expo Modules v2, the same API expo-haptics 58 uses in this app.
 *
 * The kit's listener (nyc-mon packages/ui/reserved-regions.native.ts) takes
 * the "changed" payload as ReservedRegion[]. The legacy ModuleDefinition
 * bridge can only emit a Map body (JNIUtils.emitEvent takes Map<String, Any?>),
 * so only a v2 @Event can deliver the bare array. `v2 true` applies the
 * io.github.expo.modules.v2 compiler plugin; the runtime,
 * io.github.expo:expo-modules-v2-react, arrives through expo-modules-core's
 * own `api(...)` dependency.
 *
 * Do not list this class under "android.modules" in expo-module.config.json.
 * That list feeds the legacy ExpoModulesPackageList, which expects
 * expo.modules.kotlin.modules.Module; v2 modules are discovered by the
 * compiler plugin through ExpoModulesV2ModuleList instead.
 */
expoModule {
  canBePublished false
  v2 true
}

android {
  namespace "ai.nitroforge.reservedregions"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // LifecycleEventListener comes from react-android; Gradle resolves the
  // app's version.
  implementation 'com.facebook.react:react-android'

  // WindowInfoTracker / FoldingFeature. Nothing else in the example app pulls
  // androidx.window, so the module declares it. 1.5.1 matches nyc-mon.
  implementation "androidx.window:window:1.5.1"
}
