packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: false

overrides:
  enhanced-resolve: 5.26.1

  # Expo 58 pins Metro 0.87.1 (@expo/metro). Keep the whole family on it;
  # Metro 0.87.2 needs addRoot/getRoots that Expo CLI 58.1.19's file-map fork lacks.
  metro: 0.87.1
  metro-babel-transformer: 0.87.1
  metro-cache: 0.87.1
  metro-cache-key: 0.87.1
  metro-config: 0.87.1
  metro-core: 0.87.1
  metro-file-map: 0.87.1
  metro-minify-terser: 0.87.1
  metro-resolver: 0.87.1
  metro-runtime: 0.87.1
  metro-source-map: 0.87.1
  metro-symbolicate: 0.87.1
  metro-transform-plugins: 0.87.1
  metro-transform-worker: 0.87.1
patchedDependencies:
  '@react-native-masked-view/masked-view@0.3.2': patches/@react-native-masked-view__masked-view@0.3.2.patch
  expo-router@58.0.30: patches/expo-router@58.0.30.patch
  react-native-screens@4.30.1: patches/react-native-screens@4.30.1.patch
  react-native-svg@15.16.0: patches/react-native-svg@15.16.0.patch
