<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nitro Forge Persona — c</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#F4EFE8;--mut:#B7AFA4;--ember:#FF7A3D;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.12)}
*{margin:0;box-sizing:border-box}
body{color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100vh;
 background:linear-gradient(180deg,#1B2A4A 0%,#3E5A86 34%,#C98D6B 52%,#2A2230 68%,#0D0B10 100%)}
.hero{min-height:100vh;display:grid;place-items:center;text-align:center;position:relative;padding:30px}
.orbwrap{position:relative;width:min(78vw,520px);aspect-ratio:1;margin:0 auto 40px}
.orb{position:absolute;inset:0;border-radius:50%;overflow:hidden;
 background:
  radial-gradient(42% 30% at 50% 72%, #0E0B12 0%, #0E0B12 42%, transparent 72%),
  radial-gradient(66% 38% at 50% 70%, #FF8A4C 0%, rgba(255,122,61,.55) 45%, transparent 75%),
  linear-gradient(180deg,#31456E 0%,#6E86AC 46%,#D9A983 60%,#241F2E 78%,#0D0B10 100%);
 box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4), inset 0 30px 60px rgba(255,255,255,.14), 0 60px 120px -40px rgba(0,0,0,.8)}
.orb::after{content:"";position:absolute;inset:-30%;background:conic-gradient(from 200deg,transparent,rgba(255,200,150,.22),transparent 25%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orb img{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);width:52%;opacity:.85;filter:saturate(.85) brightness(1.05)}
.ring{position:absolute;inset:-6%;border-radius:50%;border:1px dashed rgba(255,255,255,.25);animation:spin 26s linear infinite reverse}
h1{font-size:clamp(48px,8vw,130px);font-weight:800;line-height:.92;letter-spacing:-.02em}
h1 span{display:block}
h1 .thin{font-weight:400;color:#E8C9A8}
.sub{margin:26px auto 0;max-width:46ch;color:var(--mut);font-size:17px;line-height:1.6}
.btn{margin-top:34px;background:var(--ember);color:#2A1206;font-weight:600;font-size:16px;padding:16px 34px;border-radius:999px;border:0;cursor:pointer;box-shadow:0 20px 40px -18px rgba(255,122,61,.6)}
.fact{position:absolute;left:28px;bottom:26px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.fact.r{right:28px}
@media(max-width:640px){.fact{left:18px;right:18px;bottom:16px;text-align:center}}
</style></head><body>
<section class="hero">
 <div class="orbwrap"><div class="ring"></div><div class="orb"><img src="../assets/head-glass.png" alt="Parametric head model"></div></div>
 <h1><span>Your face,</span><span class="thin">rendered</span><span>at dusk.</span></h1>
 <p class="sub">Nitro Forge Persona captures you on your phone, fits a parametric head, and puts a live double inside your XR headset.</p>
 <button class="btn">Begin capture</button>
 <div class="fact">GNM Head V3 · 17,821 verts</div>
 <div class="fact r">Apache-2.0 pipeline</div>
</section>
</body></html>
