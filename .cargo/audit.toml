# cargo-audit configuration for the Forge Cargo.lock.
#
# The CI job `cargo audit --deny warnings` (.github/workflows/cargo-audit.yml)
# reads this file. Only the advisory below is ignored. It is a held
# dependency recorded in docs/release/RELEASE_TRAIN.md, "Held". Any other
# advisory, warning or yanked crate fails the job.
#
# Removing an entry is part of the PR named in its return condition.

[advisories]
ignore = [
  # chrono 0.4.45: unmaintained (warning). No fixed version exists.
  # Reason: pdfium-render (folio-render, host-side) depends on chrono with no
  # feature to turn it off, in 0.9.5 and in the latest 0.9.6. folio-engine's
  # lopdf 0.47 no longer pulls it (default features off), so pdfium-render is
  # the only path left.
  # Return when: pdfium-render stops pulling chrono, or a maintained chrono
  # release clears the advisory.
  "RUSTSEC-2026-0543",
]
