name: NitroForge skills and review contract

on:
  push:
    branches: [docs/skills-roster-quality-gates-2026-11-02]
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'docs/ENGINEERING_SKILLS.md'
      - 'docs/WORKSTREAM_ROSTER.md'
      - '.agents/skills/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - 'tooling/skills/validate.mjs'
      - '.github/workflows/skills-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  review-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node tooling/skills/validate.mjs
