name: Nitro v1 real native registration and Rust linkage
on:
  pull_request:
    paths:
      - "packages/ignition-v1-lab/**"
      - "tooling/native/stage_nf_v1_consumer.mjs"
      - "tooling/native/build_nf_v1_artifacts.sh"
      - "tooling/native/verify_nf_v1_linkage.mjs"
      - "tooling/native/verify_nf_v1_app_link.sh"
      - "tooling/native/stage_nf_v1_minimal_consumer.mjs"
      - "tooling/native/check-swift-tools.mjs"
      - "tooling/native/nf_v1_symbols.txt"
      - "examples/native-linkage/**"
      - "rust/**"
      - "packages/*/rust/**"
      - ".github/workflows/nitro-v1-platform-link.yml"
  workflow_dispatch:

concurrency:
  group: nitro-v1-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  # One list for the Rust archives and Gradle's reactNativeArchitectures, so
  # abiFilters always matches the archives that exist.
  NF_ANDROID_ABIS: "arm64-v8a,armeabi-v7a,x86_64"

jobs:
  contracts:
    name: Generate Nitro v1 classes and verify native registration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - name: Install the exact isolated v1 toolchain
        run: corepack pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate Nitro v1 classes and platform bindings
        run: corepack pnpm --filter @nitro-forge/ignition-v1-lab codegen
      - name: Committed Package.swift matches Nitrogen output
        run: git diff --exit-code -- packages/ignition-v1-lab/Package.swift
      - name: Verify native module linkage source and generated registry
        run: node tooling/native/verify_nf_v1_linkage.mjs
      - name: Check generated TS factory/document contract
        run: corepack pnpm --filter @nitro-forge/ignition-v1-lab typecheck

  android:
    name: Build Android Rust archive + Expo 58 registered JNI consumer
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mikevocalz/nitro-forge
          ref: 6cd336324019a096517967ef77dbdb43e56ee045
          path: dependency-cadence
      - uses: actions/checkout@v4
        with:
          repository: mikevocalz/NYC-Tron-UI
          ref: de7bde8aad73f3de59c89ca52d0a6052689aeb48
          path: dependency-tron
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-nf-sys
      - name: Install real Android Rust toolchain
        run: |
          cargo install cargo-ndk --locked
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - run: corepack enable
      - run: corepack pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate actual native v1 bindings
        run: corepack pnpm --filter @nitro-forge/ignition-v1-lab codegen
      - name: Build and verify real Rust staticlibs for every app ABI
        env:
          NF_ANDROID_API: "24"
        run: bash tooling/native/build_nf_v1_artifacts.sh android
      - name: Stage independently owned Forge and NYC-Tron sources
        run: |
          node tooling/native/stage_nf_v1_consumer.mjs \
            dependency-cadence dependency-tron "$RUNNER_TEMP/nitro-v1-native-lab"
      - name: Typecheck registered factory and actual Cadence native consumer
        run: |
          cd "$RUNNER_TEMP/nitro-v1-native-lab"
          corepack pnpm install --no-frozen-lockfile --ignore-scripts
          corepack pnpm --dir app typecheck
      - name: Compile Android app, JNI OnLoad and real Rust archive
        run: |
          cd "$RUNNER_TEMP/nitro-v1-native-lab"
          corepack pnpm --dir app exec expo prebuild --platform android --no-install --non-interactive
          cd app/android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon \
            -PreactNativeArchitectures="$NF_ANDROID_ABIS" --stacktrace
      - name: Prove every ABI's linked libNitroForgeV1.so defines the Rust entry points
        run: |
          cd "$RUNNER_TEMP/nitro-v1-native-lab"
          NM="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -path '*/bin/llvm-nm' | head -1)"
          APK="$(find app/android/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -n "$APK" || { echo "No debug APK was built" >&2; exit 1; }
          mapfile -t SYMBOLS < <(grep -Ev '^(#|$)' "$GITHUB_WORKSPACE/tooling/native/nf_v1_symbols.txt")
          IFS=',' read -r -a ABIS <<<"$NF_ANDROID_ABIS"
          for abi in "${ABIS[@]}"; do
            SO="$(find packages/ignition-v1-lab/android/build -path "*/$abi/libNitroForgeV1.so" | head -1)"
            test -n "$SO" || { echo "libNitroForgeV1.so was not built for $abi" >&2; exit 1; }
            unzip -l "$APK" | grep -q "lib/$abi/libNitroForgeV1.so" || {
              echo "APK does not package lib/$abi/libNitroForgeV1.so" >&2; exit 1;
            }
            for sym in "${SYMBOLS[@]}"; do
              "$NM" --defined-only "$SO" | grep -Eq " T ${sym}$" || { echo "$SO does not define $sym" >&2; exit 1; }
            done
            echo "$abi: ${#SYMBOLS[@]} nf_v1 symbols defined in $SO:"
            "$NM" --defined-only "$SO" | grep -E ' T nf_v1_'
          done

  apple-artifacts:
    name: Build Apple Rust XCFramework + generated SwiftPM package
    runs-on: macos-latest
    timeout-minutes: 75
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: apple-nf-sys
      - run: corepack enable
      - run: corepack pnpm install --no-frozen-lockfile --ignore-scripts
      - name: Generate actual Nitro v1 SwiftPM package targets
        run: corepack pnpm --filter @nitro-forge/ignition-v1-lab codegen
      - name: Build actual Apple device and simulator Rust static XCFramework
        run: bash tooling/native/build_nf_v1_artifacts.sh apple
      - name: Install Swift 6.4 toolchain required by Nitro v1
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.4.2"
      - name: Verify SwiftPM native package manifest with real Rust artifacts
        run: |
          swift --version
          swift package --package-path packages/ignition-v1-lab dump-package
          test -f packages/ignition-v1-lab/native/apple/NitroForgeRust.xcframework/Info.plist
      # dump-package only parses the manifest. The ios-link job below compiles
      # and links the package inside an Expo app.

  ios-link:
    name: Compile and link minimal Expo 58 SwiftPM consumer (iOS Simulator)
    # Nitro v1's Package.swift declares swift-tools-version 6.4. macos-latest
    # ships Swift 6.3.3, which cannot resolve it; xcode-27 carries Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 75
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-link-nf-sys
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate actual Nitro v1 SwiftPM package targets
        run: corepack pnpm --filter @nitro-forge/ignition-v1-lab codegen
      - name: Committed Package.swift matches Nitrogen output
        run: git diff --exit-code -- packages/ignition-v1-lab/Package.swift
      - name: Build Rust XCFramework (device arm64, simulator arm64 + x86_64)
        run: bash tooling/native/build_nf_v1_artifacts.sh apple
      - name: Stage the minimal consumer (Nitro v1 lab package only)
        # The Cadence + NYC-Tron consumer cannot build under SwiftPM yet:
        # NYC-Tron's native-controls imports ExpoUI but declares that only in
        # its podspec, and Expo's generated source package for it drops the
        # dependency ("Unable to resolve module dependency: 'ExpoUI'"). That
        # fix belongs in NYC-Tron (a Package.swift for native-controls), not
        # here; this job proves this package alone.
        run: node tooling/native/stage_nf_v1_minimal_consumer.mjs "$RUNNER_TEMP/nitro-v1-ios-link"
      - name: Install the staged consumer
        run: |
          cd "$RUNNER_TEMP/nitro-v1-ios-link"
          corepack pnpm install --no-frozen-lockfile --ignore-scripts
          corepack pnpm --dir app typecheck
      - name: Swift toolchain satisfies react-native-nitro-modules
        run: |
          xcodebuild -version
          node "$GITHUB_WORKSPACE/tooling/native/check-swift-tools.mjs" "$RUNNER_TEMP/nitro-v1-ios-link/app"
      - name: Expo prebuild with experiments.swiftPackageManager
        # Without --no-install, prebuild also runs Expo's SwiftPM setup.
        run: |
          cd "$RUNNER_TEMP/nitro-v1-ios-link/app"
          corepack pnpm exec expo prebuild --platform ios --non-interactive
      - name: xcodebuild for the iOS Simulator (arm64 + x86_64)
        run: |
          cd "$RUNNER_TEMP/nitro-v1-ios-link/app/ios"
          project=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          scheme=$(basename "$project" .xcodeproj)
          xcodebuild -project "$project" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/nitro-v1-ios-dd" CODE_SIGNING_ALLOWED=NO build
      - name: Prove the app binary links every nf_v1 symbol in every architecture
        run: |
          app=$(find "$RUNNER_TEMP/nitro-v1-ios-dd/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          bash tooling/native/verify_nf_v1_app_link.sh "$app"
