name: Telemetry adapter
on:
  pull_request:
    paths:
      - 'packages/telemetry/**'
      - 'packages/ignition/**'
      - 'packages/prism/**'
      - 'rust/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: corepack enable && pnpm install --frozen-lockfile --ignore-scripts
      - run: cargo build --locked -p nf-cli
      - run: pnpm --filter @nitro-forge/telemetry typecheck
      - run: pnpm --filter @nitro-forge/telemetry test
        env:
          NF_CLI: ${{ github.workspace }}/target/debug/nf-cli
