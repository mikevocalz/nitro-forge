name: v1 readiness gates

on:
  pull_request:
    paths:
      - 'docs/release/**'
      - 'compatibility.v1.json'
      - 'tooling/validate-v1*'
      - '.github/workflows/v1-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v1-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: node --test tooling/validate-v1.test.mjs
      # Report-only: a prerelease run fails only on a malformed gate file or an
      # unbacked compatibility claim. The stable check (no --version) stays red
      # until every gate passes, so it is not run on pull requests.
      - run: node tooling/validate-v1.mjs --version 1.0.0-rc.1
