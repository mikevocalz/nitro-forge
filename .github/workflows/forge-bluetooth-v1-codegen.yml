name: Forge Bluetooth Nitro v1 source/codegen
on:
  pull_request:
    paths:
      - 'packages/bluetooth-v1/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/forge-bluetooth-v1-codegen.yml'
  push:
    branches:
      - 'feat/pen-connect-*'
    paths:
      - 'packages/bluetooth-v1/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/forge-bluetooth-v1-codegen.yml'
jobs:
  nitro-bluetooth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nitro-forge/bluetooth-v1 codegen
      - run: pnpm --filter @nitro-forge/bluetooth-v1 typecheck
      - name: Check generated native code exists
        run: |
          test -f packages/bluetooth-v1/nitrogen/generated/android/NitroForgeBluetoothV1+autolinking.gradle
          test -f packages/bluetooth-v1/nitrogen/generated/android/NitroForgeBluetoothV1+autolinking.cmake
          test -f packages/bluetooth-v1/nitrogen/generated/shared/javascript/ForgeBluetooth.cjs
  kotlin-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Install Android API 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nitro-forge/bluetooth-v1 codegen
      - name: Compile Kotlin against the real Nitro v1 runtime (no CMake link)
        run: gradle -p packages/bluetooth-v1/android-compile-check :bt:compileDebugKotlin --no-daemon --stacktrace
