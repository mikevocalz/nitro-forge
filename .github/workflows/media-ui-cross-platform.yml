name: Media UI cross-platform contracts

on:
  pull_request:
    paths:
      - 'packages/media-ui/**'
      - '.github/workflows/media-ui-cross-platform.yml'
      - 'apps/forge-media-lab/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    name: TypeScript + contract tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install SDK 58 peer-isolated contract dependencies
        run: pnpm install --frozen-lockfile
      - name: Strict public API typecheck
        run: pnpm --filter @nitro-forge/media-ui typecheck
      - name: Pure behavior contract tests
        run: pnpm --filter @nitro-forge/media-ui test
      - name: Expo SDK 58 app TypeScript integration
        run: pnpm --filter @nitro-forge/media-lab typecheck
      - name: Metro web bundle smoke test
        if: runner.os == 'Linux'
        run: pnpm --filter @nitro-forge/media-lab export:web
      - name: Document validation scope
        run: echo "Native iOS/Android device E2E and web browser E2E are pending."
