name: Full component completion ledger
on:
  pull_request:
    paths:
      - 'docs/completion/**'
      - 'tooling/verify-completion-plan*'
      - '.github/workflows/completion-plan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  completion-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: node tooling/verify-completion-plan.mjs
      - run: node --test tooling/verify-completion-plan.test.mjs
