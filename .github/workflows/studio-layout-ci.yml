name: Studio workspace and dock contract

on:
  push:
    branches:
      - docs/studio-snaprails-mobbin-workspace-2026-11-02
  pull_request:
    paths:
      - 'packages/prism/**'
      - 'packages/cadence/**'
      - 'packages/splice/**'
      - 'packages/folio/**'
      - 'packages/pitch/**'
      - 'packages/tally/**'
      - 'packages/quill/**'
      - 'docs/ENGINE_OPS.md'
      - 'docs/ux/studio-workspace-layout.v1.schema.json'
      - 'packages/ignition/**'
      - 'rust/**'
      - 'packages/studio-layout/**'
      - 'packages/studio-workspace/**'
      - 'packages/icons/**'
      - 'apps/studio-preview/**'
      - 'apps/example/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'tsconfig.base.json'
      - 'tooling/nyc-tron.json'
      - 'tooling/verify-nyc-tron.mjs'
      - '.github/workflows/studio-layout-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: nitro-forge

jobs:
  dock-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: nitro-forge
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
      - run: corepack enable
      # NYC-Tron UI comes from release tarballs pinned in tooling/nyc-tron.json.
      - name: Install for new workspace package
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check recovered adapters against the published NYC-Tron declarations
        run: pnpm verify:released-ui
      - name: NYC-Tron release pins match their sha256
        run: node tooling/verify-nyc-tron.mjs
      - name: Nitro v1 code generation and host contracts
        run: |
          pnpm --filter @nitro-forge/ignition codegen
          git diff --exit-code -- packages/ignition/nitrogen/generated
          pnpm --filter @nitro-forge/ignition typecheck
          pnpm --filter @nitro-forge/ignition exec vitest run tests/nitro-host.test.ts
      - name: Native host image and gesture dependencies
        run: |
          node --test apps/example/tooling/host-native-resolver.test.cjs
          node apps/example/tooling/verify-native-host.cjs
      - name: Run real typed dock model tests
        run: pnpm --filter @nitro-forge/studio-layout test
      - name: Strict TypeScript contract
        run: pnpm --filter @nitro-forge/studio-layout typecheck
      - name: Original glyph contracts and generated theme parity
        run: |
          pnpm --filter @nitro-forge/icons test
          pnpm --filter @nitro-forge/icons typecheck
          pnpm --filter @nitro-forge/studio-workspace build:theme
          git diff --exit-code -- packages/studio-workspace/src/theme.css packages/studio-workspace/src/theme.native.css
      - name: Workspace transitions and strict types
        run: |
          node packages/studio-workspace/verify-ui-boundary.mjs
          pnpm --filter @nitro-forge/studio-workspace test
          pnpm --filter @nitro-forge/studio-workspace typecheck
          pnpm --filter @nitro-forge/example typecheck
          pnpm --filter @nitro-forge/studio-preview typecheck
      - name: Browser UI module contracts and production bundle
        run: |
          pnpm --filter @nitro-forge/studio-preview test:ui-modules
          pnpm --filter @nitro-forge/studio-preview build
      # A blank page passes typecheck and build; load the Studio and require its launcher.
      - name: Studio shell renders in Chromium (production build and dev server)
        run: |
          pnpm --filter @nitro-forge/studio-preview exec playwright install --with-deps chromium
          pnpm --filter @nitro-forge/studio-preview test:render:build
          pnpm --filter @nitro-forge/studio-preview test:render
      - name: Retain the exact rendered production bundle with provenance
        env:
          FORGE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { lstatSync, mkdirSync, readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';

          const sourceRevision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const pullRequestHeadRevision = process.env.FORGE_PR_HEAD_SHA;
          assert.match(sourceRevision, /^[0-9a-f]{40}$/);
          assert.equal(sourceRevision, process.env.GITHUB_SHA, 'checkout must match the tested workflow revision');
          assert.match(pullRequestHeadRevision, /^[0-9a-f]{40}$/);
          const dist = resolve('apps/studio-preview/dist');
          assert.ok(lstatSync(dist).isDirectory() && !lstatSync(dist).isSymbolicLink());
          assert.ok(readFileSync(join(dist, 'index.html')).length, 'production index must exist');
          const output = join(process.env.RUNNER_TEMP, 'studio-preview-rendered-build');
          mkdirSync(output);
          const files = [];
          const hash = bytes => createHash('sha256').update(bytes).digest('hex');
          function retain(directory, relative = '') {
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              const entry = relative ? relative + '/' + name : name;
              const stat = lstatSync(path);
              if (stat.isDirectory()) retain(path, entry);
              else {
                assert.ok(stat.isFile() && !stat.isSymbolicLink(), 'only regular build files are retained');
                const bytes = readFileSync(path);
                const target = join(output, 'dist', entry);
                mkdirSync(dirname(target), { recursive: true });
                writeFileSync(target, bytes);
                files.push({ path: 'dist/' + entry, bytes: bytes.length, sha256: hash(bytes) });
              }
            }
          }
          retain(dist);
          writeFileSync(join(output, 'provenance.json'), JSON.stringify({
            schemaVersion: 1, repository: process.env.GITHUB_REPOSITORY,
            sourceRevision, pullRequestHeadRevision,
            runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runUrl: process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID,
            capturedAt: new Date().toISOString(), nodeVersion: process.version,
            lockfileSha256: hash(readFileSync('pnpm-lock.yaml')),
            buildCommand: 'pnpm --filter @nitro-forge/studio-preview build',
            passedRenderCommands: ['pnpm --filter @nitro-forge/studio-preview test:render:build', 'pnpm --filter @nitro-forge/studio-preview test:render'],
            scope: 'Chromium launcher rendering only. Engine operations require the existing Vite/nf-cli bridge; no native or standalone engine-service acceptance.',
            files,
          }, null, 2) + '\n');
          console.log('Retained ' + files.length + ' rendered production files at ' + sourceRevision);
          NODE
      # cargo test --workspace runs once, in rust-session-contracts.
      - name: Build real engine host
        run: cargo build --locked -p nf-cli
      - name: Prism typed API round trips
        run: |
          pnpm --filter @nitro-forge/prism typecheck
          pnpm --filter @nitro-forge/prism test
      - name: Studio preview row wiring (recorded calls and real engines)
        run: |
          pnpm --filter @nitro-forge/studio-preview test
          pnpm --filter @nitro-forge/studio-preview test:engine
      - name: Seven-engine browser bridge round trips
        run: pnpm --filter @nitro-forge/studio-preview test:integration
      - name: Upload the rendered production bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: studio-preview-rendered-build
          path: ${{ runner.temp }}/studio-preview-rendered-build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  rust-session-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: nitro-forge
      - name: Rust engine tests and v1 session contracts
        run: |
          cargo test --locked --workspace
          cargo build --locked -p nf-sys
          g++ -std=c++20 -Wall -Wextra -Werror -I packages/ignition/cpp tooling/native/serial_queue_test.cpp -o /tmp/serial-queue-test
          /tmp/serial-queue-test
          g++ -std=c++20 -Wall -Wextra -Werror -I packages/ignition/cpp tooling/native/nf_v1_cpp_smoke.cpp packages/ignition/cpp/ForgeRustSession.cpp target/debug/libnf_sys.a -ldl -lpthread -lm -o target/nf-v1-smoke
          target/nf-v1-smoke
  expo-native-bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: nitro-forge
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Metro0.87.2 compatibility and native styles
        run: |
          node --test apps/example/tooling/metro-dynamic-roots.test.cjs apps/example/tooling/metro-watcher-lifecycle.test.cjs apps/example/tooling/native-theme-source.test.mjs
          node apps/example/tooling/verify-native-styles.cjs
      - name: Coherent Metro family and dynamic-root API
        run: node apps/example/tooling/verify-metro-stack.cjs
      - name: Export iOS, Android and web bundles through Expo's own Metro
        working-directory: nitro-forge/apps/example
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
        run: |
          pnpm exec expo export --platform ios --max-workers 2 --no-minify --no-bytecode --output-dir /tmp/export-ios
          pnpm exec expo export --platform android --max-workers 2 --no-minify --no-bytecode --output-dir /tmp/export-android
          pnpm exec expo export --platform web --max-workers 2 --no-minify --output-dir /tmp/export-web
          test -s /tmp/export-web/index.html
          test -s "$(ls /tmp/export-ios/_expo/static/js/ios/*.js)"
          test -s "$(ls /tmp/export-android/_expo/static/js/android/*.js)"
          # The design studio's persona turret ships in both native bundles.
          grep -q persona-turret-ring /tmp/export-ios/_expo/static/js/ios/*.js
          grep -q persona-turret-ring /tmp/export-android/_expo/static/js/android/*.js
# UI gestures, native devices and assistive technology require separate evidence.
