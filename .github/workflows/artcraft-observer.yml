name: ArtCraft observed-commit intake

on:
  pull_request:
    paths:
      - 'upstream.candidates.json'
      - 'tooling/upstream/**'
      - '.github/workflows/artcraft-observer.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'

permissions:
  contents: read

jobs:
  verify-observer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tooling/upstream/watch.test.mjs
      - run: node tooling/upstream/watch.mjs --validate

  observe-and-propose:
    needs: verify-observer
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Observe public ArtCraft merged heads (never change admitted sources)
        run: node tooling/upstream/watch.mjs --write
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Propose reviewer-only upstream observation PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/artcraft-observed-heads
          base: master
          delete-branch: true
          commit-message: 'chore(upstream): update observed ArtCraft Git HEADs'
          title: 'chore(upstream): review new ArtCraft merged changes'
          body: |
            This PR updates **observed** source metadata only. No engine
            dependencies, ABI bindings, Moyo code or published artifacts change.
            Review `reports/upstream/last-observed-update.md` for exact compare
            links. Assess merged PR content, licensing, native/WebAssembly
            support, security and tests before any follow-up admission PR.
            Do not auto-merge or treat observed SHA as an admitted build.
          labels: |
            dependencies
          add-paths: |
            upstream.candidates.json
            reports/upstream/last-observed-update.md
