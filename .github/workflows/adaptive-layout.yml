name: Extracted adaptive layout geometry tests

on:
  push:
    branches:
      - docs/shared-expo-meta-adaptive-ui-2026-11-02
  pull_request:
    paths:
      - 'packages/adaptive-layout/**'
      - '.github/workflows/adaptive-layout.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  fold-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: corepack enable
      - name: Install new package without altering lockfile in this draft
        run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm --filter @nitro-forge/adaptive-layout test
      - run: pnpm --filter @nitro-forge/adaptive-layout typecheck

# Does not prove native Expo UI, WindowManager, iPad or Meta XR functionality.
