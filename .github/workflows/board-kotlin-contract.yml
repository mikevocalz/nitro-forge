name: Forge Board native Kotlin JVM contract
on:
  pull_request:
    paths:
      - 'packages/board/android/src/main/java/**'
      - 'packages/board/android/src/test/java/**'
      - 'tooling/board-kotlin-core/**'
      - '.github/workflows/board-kotlin-contract.yml'
  push:
    branches:
      - 'feat/native-whiteboard-*'
    paths:
      - 'packages/board/android/**'
      - 'tooling/board-kotlin-core/**'
      - '.github/workflows/board-kotlin-contract.yml'
jobs:
  kotlin-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: JUnit against extracted Android renderer's pure Kotlin source files
        working-directory: tooling/board-kotlin-core
        run: gradle test --no-daemon --stacktrace
