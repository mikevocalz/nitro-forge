name: Cargo audit
on:
  pull_request:
    paths:
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
      - '.github/workflows/cargo-audit.yml'
  push:
    branches: [master]
    paths:
      - 'Cargo.lock'
      - '.cargo/audit.toml'
  schedule:
    - cron: '17 6 * * 1' # Weekly: new advisories appear without a lockfile change
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # install-action v2.90.3 downloads a prebuilt cargo-audit binary.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.23.0
      # --deny warnings fails on unmaintained, unsound and yanked crates as
      # well as vulnerabilities. Ignores come from .cargo/audit.toml only.
      - run: cargo audit --deny warnings
