name: Cadence + NYC-Tron native consumer
on:
  pull_request:
    paths:
      - "packages/cadence/**"
      - "examples/native-cadence/**"
      - "tooling/native/stage-cadence-consumer.mjs"
      - ".github/workflows/cadence-native-consumer.yml"
  workflow_dispatch:
concurrency:
  group: cadence-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
  # NYC-Tron v0.1.0-alpha.2. alpha.1 imported ExpoUI from the native-controls
  # module, which Expo SDK 58 SwiftPM source builds cannot resolve (fixed in d4f350a).
  NYC_TRON_REF: ff08d05b8d42ecffddc71ee674016bf10c47d2c6
jobs:
  consumer-types:
    name: Native consumer workspace and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mikevocalz/NYC-Tron-UI
          ref: ff08d05b8d42ecffddc71ee674016bf10c47d2c6
          path: dependency-nyc-tron
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - name: Build NYC-Tron native-controls (exports dist only)
        working-directory: dependency-nyc-tron
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @nyc-tron/native-controls build
      - name: Stage real source packages without vendoring
        run: node tooling/native/stage-cadence-consumer.mjs dependency-nyc-tron "$RUNNER_TEMP/cadence-lab"
      - name: Install and typecheck
        run: |
          cd "$RUNNER_TEMP/cadence-lab"
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm --dir app typecheck
  android:
    name: Expo 58 Android consumer compile
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: consumer-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mikevocalz/NYC-Tron-UI
          ref: ff08d05b8d42ecffddc71ee674016bf10c47d2c6
          path: dependency-nyc-tron
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: corepack enable
      - name: Build NYC-Tron native-controls (exports dist only)
        working-directory: dependency-nyc-tron
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @nyc-tron/native-controls build
      - run: node tooling/native/stage-cadence-consumer.mjs dependency-nyc-tron "$RUNNER_TEMP/cadence-lab"
      - run: |
          cd "$RUNNER_TEMP/cadence-lab"
          corepack pnpm install --no-frozen-lockfile
          corepack pnpm --dir app exec expo prebuild --platform android --no-install --non-interactive
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
  ios:
    name: Expo 58 iOS consumer compile
    # Nitro v1's Package.swift declares swift-tools-version 6.4; its README says
    # iOS builds require Swift 6.4 or newer. macos-latest ships Xcode 26.6 with
    # Swift 6.3.3, which cannot resolve the package. xcode-27 carries Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 60
    needs: consumer-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: mikevocalz/NYC-Tron-UI
          ref: ff08d05b8d42ecffddc71ee674016bf10c47d2c6
          path: dependency-nyc-tron
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - name: Build NYC-Tron native-controls (exports dist only)
        working-directory: dependency-nyc-tron
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm --filter @nyc-tron/native-controls build
      - run: node tooling/native/stage-cadence-consumer.mjs dependency-nyc-tron "$RUNNER_TEMP/cadence-lab"
      - run: |
          cd "$RUNNER_TEMP/cadence-lab"
          corepack pnpm install --no-frozen-lockfile
          xcodebuild -version
          node "$GITHUB_WORKSPACE/tooling/native/check-swift-tools.mjs" app
          corepack pnpm --dir app exec expo prebuild --platform ios --no-install --non-interactive
          cd app
          # Nitro v1 is SwiftPM-only; its Podspec is intentionally empty.
          # Expo SDK 58 SwiftPM integration is preview/experimental, not default.
          corepack pnpm exec react-native spm add --deintegrate --yes
          cd ios
          project=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          scheme=$(basename "$project" .xcodeproj)
          xcodebuild -project "$project" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
