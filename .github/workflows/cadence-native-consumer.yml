name: Cadence + NYC-Tron native consumer
on:
  pull_request:
    paths:
      - "packages/cadence/**"
      - "packages/ignition/**"
      - "packages/telemetry/**"
      - "packages/board/**"
      - "packages/*/rust/**"
      - "rust/**"
      - "examples/native-cadence/**"
      - "tooling/nyc-tron.json"
      - "tooling/nyc-tron-metro.cjs"
      - "tooling/verify-nyc-tron-pin.mjs"
      - "tooling/native/**"
      - ".github/workflows/cadence-native-consumer.yml"
  workflow_dispatch:
concurrency:
  group: cadence-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"
# examples/native-cadence is its own pnpm workspace (Expo 58 / RN 0.88) that
# joins packages/ignition and packages/cadence from source and installs
# @nyc-tron/* from the release tarballs pinned in tooling/nyc-tron.json.
# No NYC-Tron checkout, no staging copy.
jobs:
  consumer-types:
    name: Native consumer install, TypeScript and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - run: corepack enable
      - name: Verify NYC-Tron pin and re-hash release assets
        run: node tooling/verify-nyc-tron-pin.mjs --download
      - name: Frozen install from release tarballs
        working-directory: examples/native-cadence
        run: corepack pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: examples/native-cadence
        run: corepack pnpm typecheck
      - name: Verify fresh native receipts and actual entry routing
        run: node --test tooling/native/runtime-receipt.test.mjs
      - name: Compile the MMKV v4 port and verify real core reopen
        env:
          FORGE_MMKV_PORT_OUTPUT: ${{ runner.temp }}/forge-mmkv-port
        run: |
          git clone --depth 1 --branch v2.4.0 https://github.com/Tencent/MMKV.git "$RUNNER_TEMP/mmkv-core"
          node tooling/native/verify-mmkv-port.mjs "$RUNNER_TEMP/mmkv-core"
      - name: Retain MMKV source and core evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-mmkv-port
          path: ${{ runner.temp }}/forge-mmkv-port
      - name: Bundle with Metro and check one copy of each shared runtime
        working-directory: examples/native-cadence
        run: |
          for platform in android ios; do
            corepack pnpm exec expo export --platform "$platform" --dump-sourcemap \
              --output-dir "$RUNNER_TEMP/export-$platform"
            node ../../tooling/native/check-bundle-singletons.mjs "$RUNNER_TEMP/export-$platform" "$platform"
          done
  android:
    name: Expo 58 Android consumer compile and runtime
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: consumer-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: corepack enable
      - working-directory: examples/native-cadence
        run: corepack pnpm install --frozen-lockfile
      - name: Build Rust archives with the React Native app's NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version=$(cd examples/native-cadence && node -e 'const fs=require("node:fs"),p=require("node:path");const rn=p.dirname(require.resolve("react-native/package.json"));const text=fs.readFileSync(p.join(rn,"gradle/libs.versions.toml"),"utf8");const match=text.match(/^ndkVersion\s*=\s*"([^"]+)"/m);if(!match)throw new Error("Missing RN NDK version");console.log(match[1]);')
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$ndk_version"
          if [[ ! -f "$ANDROID_NDK_HOME/source.properties" ]]; then
            sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            test -x "$sdk_manager"
            "$sdk_manager" "ndk;$ndk_version"
          fi
          cargo install cargo-ndk --version 4.1.2 --locked
          bash packages/ignition/scripts/build-android.sh
      - working-directory: examples/native-cadence
        run: |
          corepack pnpm exec expo prebuild --platform android --no-install --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Execute generated Nitro bindings on Android
        shell: bash
        env:
          FORGE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/forge-runtime-android
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/forge-android-user"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "system-images;android-35;google_apis;x86_64" "emulator" "platform-tools"
          printf 'no\n' | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n ForgeRuntimeAcceptance -k "system-images;android-35;google_apis;x86_64" --path "$ANDROID_AVD_HOME/ForgeRuntimeAcceptance.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx 'ForgeRuntimeAcceptance'
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; fi
          "$ANDROID_HOME/emulator/emulator" -avd ForgeRuntimeAcceptance -port 5554 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -memory 3072 > "$RUNNER_TEMP/forge-emulator.log" 2>&1 &
          forge_emulator_pid=$!
          trap 'kill "$forge_emulator_pid" 2>/dev/null || true' EXIT
          node tooling/native/run-runtime-acceptance.mjs android examples/native-cadence/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Retain Android native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-native-runtime-android
          path: |
            ${{ runner.temp }}/forge-runtime-android
            ${{ runner.temp }}/forge-emulator.log
  ios:
    name: Expo 58 iOS consumer compile and runtime
    # Nitro v1's Package.swift declares swift-tools-version 6.4; its README says
    # iOS builds require Swift 6.4 or newer. macos-latest ships Xcode 26.6 with
    # Swift 6.3.3, which cannot resolve the package. xcode-27 carries Swift 6.4.
    runs-on: xcode-27
    timeout-minutes: 60
    needs: consumer-types
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - run: corepack enable
      - name: Prewarm the exact iPhone simulator while native code compiles
        env:
          FORGE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/forge-runtime-ios
        run: node tooling/native/prewarm-simulator.mjs
      - name: Build current Rust XCFramework before SwiftPM resolution
        run: bash packages/ignition/scripts/build-apple.sh
      - working-directory: examples/native-cadence
        run: |
          corepack pnpm install --frozen-lockfile
          xcodebuild -version
          node "$GITHUB_WORKSPACE/tooling/native/check-swift-tools.mjs" .
          corepack pnpm exec expo prebuild --platform ios --no-install --non-interactive
          # Nitro v1 is SwiftPM-only; its Podspec is intentionally empty.
          # Expo SDK 58 SwiftPM integration is preview/experimental, not default.
          corepack pnpm exec react-native spm add --deintegrate --yes
          cd ios
          project=$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)
          test -n "$project"
          scheme=$(basename "$project" .xcodeproj)
          if ! xcodebuild -project "$project" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/forge-cadence-build" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/forge-cadence-build.log" 2>&1; then
            tail -n 150 "$RUNNER_TEMP/forge-cadence-build.log"
            exit 1
          fi
          tail -n 8 "$RUNNER_TEMP/forge-cadence-build.log"
      - name: Execute generated Nitro bindings on iOS
        shell: bash
        env:
          FORGE_ACCEPTANCE_OUTPUT: ${{ runner.temp }}/forge-runtime-ios
        run: |
          set -euo pipefail
          forge_apps=("$RUNNER_TEMP/forge-cadence-build/Build/Products/Debug-iphonesimulator/"*.app)
          test "${#forge_apps[@]}" -eq 1
          test -d "${forge_apps[0]}"
          node tooling/native/run-runtime-acceptance.mjs ios "${forge_apps[0]}"
      - name: Retain iOS native runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: forge-native-runtime-ios
          path: |
            ${{ runner.temp }}/forge-runtime-ios
            ${{ runner.temp }}/forge-cadence-build.log
