[workspace]
resolver = "2"
members = [
    "rust/ignition-core",
    "rust/nf-cli",
    "rust/nf-sys",
    "rust/nf-raw",
    "packages/*/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ignition-core = { path = "rust/ignition-core" }
